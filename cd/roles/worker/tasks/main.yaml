---
# Worker play: stage assets + join command → run installer.
# join_command.txt is fetched from the control plane by the preceding play
# and sits at /tmp/join_command.txt on the Ansible host by the time this runs.

- name: Copy payload directory to worker
  copy:
    src: "{{ playbook_dir }}/../../payload/"
    dest: /tmp/payload/
    mode: preserve

- name: Copy configs directory to worker
  copy:
    src: "{{ playbook_dir }}/../../configs/"
    dest: /tmp/configs/
    mode: preserve

- name: Copy install.sh to worker
  copy:
    src: "{{ playbook_dir }}/../../automation-scripts/install.sh"
    dest: /tmp/install.sh
    mode: "0755"

- name: Copy join command from Ansible host to worker
  copy:
    src: /tmp/join_command.txt
    dest: /tmp/join_command.txt
    mode: "0644"

- name: Run installer as worker
  shell: bash /tmp/install.sh -r worker
  args:
    executable: /bin/bash
