---
# Control plane play: stage assets → run installer → fetch join command.
# payload/ is large (2-3 GB). The copy module works but is slow over SCP;
# switch to the synchronize module (rsync) if transfer time becomes a problem.

- name: Copy payload directory to control plane
  copy:
    src: "{{ playbook_dir }}/../../payload/"
    dest: /tmp/payload/
    mode: preserve

- name: Copy configs directory to control plane
  copy:
    src: "{{ playbook_dir }}/../../configs/"
    dest: /tmp/configs/
    mode: preserve

- name: Copy install.sh to control plane
  copy:
    src: "{{ playbook_dir }}/../../automation-scripts/install.sh"
    dest: /tmp/install.sh
    mode: "0755"

- name: Run installer as control_plane
  shell: bash /tmp/install.sh -r control_plane -m {{ ansible_host }}
  args:
    executable: /bin/bash

- name: Fetch join command back to Ansible host
  fetch:
    src: /tmp/join_command.txt
    dest: /tmp/join_command.txt
    flat: yes
